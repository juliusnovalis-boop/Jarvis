name: Construction Windows (installateur Jarvis)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Installer NSIS
        run: choco install nsis --no-progress -y

      - name: Construire (portable + installateur)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File packaging/windows/Construire-Jarvis-Complet.ps1 -WithExe

      - name: Publier les artefacts de construction
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows
          path: |
            dist/Jarvis-Complete-Portable.zip
            dist/Jarvis-Complete-Setup.exe
          if-no-files-found: warn
          retention-days: 30

      - name: Publier la Release (si tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Jarvis ${{ github.ref_name }}"
          draft: false
          generate_release_notes: true
          files: |
            dist/Jarvis-Complete-Setup.exe
            dist/Jarvis-Complete-Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
