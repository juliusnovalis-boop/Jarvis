<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="J.A.R.V.I.S.">
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="74%">
      <stop offset="0" stop-color="#083252"/>
      <stop offset="0.55" stop-color="#04172b"/>
      <stop offset="1" stop-color="#01040c"/>
    </radialGradient>
    <radialGradient id="core" cx="46%" cy="42%" r="62%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#cffafe"/>
      <stop offset="0.62" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fond : plaque marine du HUD -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="3" y="3" width="506" height="506" rx="102" fill="none" stroke="#22d3ee" stroke-opacity="0.4" stroke-width="3"/>

  <!-- Halo du cœur -->
  <circle cx="256" cy="256" r="132" fill="url(#halo)"/>

  <!-- Couronne extérieure pointillée -->
  <circle cx="256" cy="256" r="214" fill="none" stroke="#22d3ee" stroke-opacity="0.6"
          stroke-width="7" stroke-dasharray="4 17" stroke-linecap="round"/>

  <!-- Graduations (12 repères horaires) -->
  <g stroke="#67e8f9" stroke-opacity="0.85" stroke-width="7" stroke-linecap="round">
    <line x1="256" y1="24" x2="256" y2="46"/>
    <line x1="256" y1="24" x2="256" y2="46" transform="rotate(30 256 256)"/>
    <line x1="256" y1="24" x2="256" y2="46" transform="rotate(60 256 256)"/>
    <line x1="256" y1="24" x2="256" y2="46" transform="rotate(90 256 256)"/>
    <line x1="256" y1="24" x2="256" y2="46" transform="rotate(120 256 256)"/>
    <line x1="256" y1="24" x2="256" y2="46" transform="rotate(150 256 256)"/>
    <line x1="256" y1="24" x2="256" y2="46" transform="rotate(180 256 256)"/>
    <line x1="256" y1="24" x2="256" y2="46" transform="rotate(210 256 256)"/>
    <line x1="256" y1="24" x2="256" y2="46" transform="rotate(240 256 256)"/>
    <line x1="256" y1="24" x2="256" y2="46" transform="rotate(270 256 256)"/>
    <line x1="256" y1="24" x2="256" y2="46" transform="rotate(300 256 256)"/>
    <line x1="256" y1="24" x2="256" y2="46" transform="rotate(330 256 256)"/>
  </g>

  <!-- Hexagone Stark -->
  <polygon points="256,88 410.5,172 410.5,340 256,424 101.5,340 101.5,172"
           fill="none" stroke="#22d3ee" stroke-width="9" stroke-opacity="0.9"
           stroke-linejoin="round"/>

  <!-- 4 arcs de visée -->
  <g fill="none" stroke="#67e8f9" stroke-width="11" stroke-linecap="round">
    <path d="M 297.4 101.5 A 160 160 0 0 1 387.1 164.2"/>
    <path d="M 297.4 101.5 A 160 160 0 0 1 387.1 164.2" transform="rotate(90 256 256)"/>
    <path d="M 297.4 101.5 A 160 160 0 0 1 387.1 164.2" transform="rotate(180 256 256)"/>
    <path d="M 297.4 101.5 A 160 160 0 0 1 387.1 164.2" transform="rotate(270 256 256)"/>
  </g>

  <!-- Engrenage interne -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#22d3ee" stroke-opacity="0.7"
          stroke-width="6" stroke-dasharray="9 15"/>

  <!-- Cœur lumineux -->
  <circle cx="256" cy="256" r="84" fill="url(#core)"/>
  <circle cx="253" cy="253" r="42" fill="#ecfeff" opacity="0.95"/>
  <circle cx="253" cy="253" r="42" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3"/>
</svg>
